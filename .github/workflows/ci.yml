name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (Linux, virtual display for the window tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -rf --junitxml=test-report.xml
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -rf --junitxml=test-report.xml
      - name: Show failed tests as annotations
        if: failure()
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          if os.path.exists("test-report.xml"):
              for case in ET.parse("test-report.xml").iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          text = (node.get("message") or "") + "\n" + (node.text or "")[-2500:]
                          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                          print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")

  installer:
    name: install.ps1 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the installer (no questions, no model download)
        shell: powershell
        run: .\install.ps1 -NonInteractive -SkipModel
      - name: Check the shortcuts
        shell: powershell
        run: |
          $shell = New-Object -ComObject WScript.Shell
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Avvia assistente.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Call Assistant'
          $expected = @('Avvia assistente', 'Prova demo', 'Verifica installazione', 'Memoria', 'Chiamate', 'Disinstalla')
          $links = @($desktop) + ($expected | ForEach-Object { Join-Path $menu "$_.lnk" })
          foreach ($path in $links) {
            if (-not (Test-Path -LiteralPath $path)) { Write-Error "missing $path"; exit 1 }
            $link = $shell.CreateShortcut($path)
            if (-not (Test-Path -LiteralPath $link.TargetPath)) { Write-Error "$path points to missing $($link.TargetPath)"; exit 1 }
            Write-Host "$path -> $($link.TargetPath) $($link.Arguments)"
          }
      - name: Check the installed environment
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe -c "import pyaudiowpatch, faster_whisper, anthropic, tkinter; import call_assistant.capture_windows; print('imports OK')"
          .\.venv\Scripts\python.exe -m call_assistant --headless --demo --fake-llm --speed 40 --home "$env:RUNNER_TEMP\ca-home"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\ca-home\calls" | Select-Object FullName

  installer-restricted:
    name: install.ps1 on Windows (restricted PowerShell, like company PCs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the installer in Constrained Language mode
        shell: powershell
        run: |
          # PowerShell reads this switch from the machine environment: new PowerShell
          # processes then run restricted, as under AppLocker/WDAC on company PCs.
          [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')
          $failed = $null
          try {
            $mode = "$(powershell -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode')".Trim()
            Write-Host "Language mode of a new PowerShell: $mode"
            if ($mode -ne 'ConstrainedLanguage') {
              $failed = "could not switch PowerShell to restricted mode (got '$mode')"
            } else {
              $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -NonInteractive -SkipModel 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $out
              if ($code -ne 0 -or -not (Test-Path .\.venv\Scripts\pythonw.exe)) {
                $failed = "install.ps1 failed (exit $code)%0A" + ((($out -split "`r?`n") | Where-Object { $_ } | Select-Object -Last 40) -join '%0A')
              }
            }
          } finally {
            [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', $null, 'Machine')
          }
          if ($failed) { Write-Host "::error title=install.ps1 in restricted PowerShell::$failed"; exit 1 }
          Get-ChildItem "$env:USERPROFILE\Desktop" -Filter 'Avvia assistente*' | Select-Object Name

  web:
    name: Web app (Node + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test web/tests/unit.test.mjs
      - name: Browser end-to-end test (fake microphone, mocked Claude API)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node web/tests/e2e.mjs
