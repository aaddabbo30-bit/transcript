<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1f1f1f">
  <title>Assistente chiamate</title>
  <meta name="description" content="Assistente per chiamate e video: trascrive nel browser con Whisper e Claude legge la chiamata dalla tua chat.">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <!-- stamp:start -->
  <script type="importmap">{"imports":{"./js/app.js":"./js/app.js?v=62a2fa9ab4","./js/audio-worklet.js":"./js/audio-worklet.js?v=62a2fa9ab4","./js/audio.js":"./js/audio.js?v=62a2fa9ab4","./js/bridge.js":"./js/bridge.js?v=62a2fa9ab4","./js/echo.js":"./js/echo.js?v=62a2fa9ab4","./js/history.js":"./js/history.js?v=62a2fa9ab4","./js/i18n.js":"./js/i18n.js?v=62a2fa9ab4","./js/icons.js":"./js/icons.js?v=62a2fa9ab4","./js/model-files.js":"./js/model-files.js?v=62a2fa9ab4","./js/motion.js":"./js/motion.js?v=62a2fa9ab4","./js/prompts.js":"./js/prompts.js?v=62a2fa9ab4","./js/script.js":"./js/script.js?v=62a2fa9ab4","./js/segmenter.js":"./js/segmenter.js?v=62a2fa9ab4","./js/session.js":"./js/session.js?v=62a2fa9ab4","./js/transcriber.js":"./js/transcriber.js?v=62a2fa9ab4","./js/transcript.js":"./js/transcript.js?v=62a2fa9ab4","./js/whisper-core.js":"./js/whisper-core.js?v=62a2fa9ab4","./js/whisper-worker.js":"./js/whisper-worker.js?v=62a2fa9ab4"}}</script>
  <link rel="stylesheet" href="css/app.css?v=62a2fa9ab4">
  <script type="module" src="js/app.js?v=62a2fa9ab4"></script>
  <!-- stamp:end -->
</head>
<body>
  <!-- As in Teams: the app bar on the left, one icon and label per section. -->
  <nav class="appbar tabs" role="tablist">
    <button role="tab" data-tab="call" class="active"><span class="icon-slot" data-icon="call"></span><span data-t="tab_call">Chiamata</span></button><button role="tab" data-tab="history"><span class="icon-slot" data-icon="history"></span><span data-t="tab_history">Archivio</span></button><button role="tab" data-tab="settings"><span class="icon-slot" data-icon="settings"></span><span data-t="tab_settings">Impostazioni</span></button>
  </nav>

  <main>
    <!-- CALL -->
    <section id="tab-call" class="tab active">
      <div id="setup" class="setup">
        <h1 class="page-title" data-t="setup_title">Nuova chiamata</h1>
        <p id="setup-notice" class="notice hidden"></p>

        <div id="claude-box" class="card claude-box">
          <div class="claude-head">
            <span class="claude-avatar" aria-hidden="true"><span class="icon-slot" data-icon="sparkle"></span><span id="claude-dot" class="dot"></span></span>
            <div class="claude-text">
              <strong id="claude-title"></strong>
              <p id="claude-text" class="secondary"></p>
            </div>
          </div>
          <div id="claude-connector-row" class="row hidden">
            <input id="setup-connector" class="connector" type="text" readonly aria-label="connector">
            <button id="setup-copy" class="primary" data-t="bridge_copy"></button>
            <button id="setup-done" class="subtle" data-t="claude_done"></button>
          </div>
          <div id="claude-settings-row" class="row hidden"><button id="go-settings" data-t="claude_go_settings"></button></div>
        </div>

        <div class="card">
          <h2 class="card-title" data-t="sources">Cosa ascoltare</h2>
          <label class="setting">
            <span class="setting-label" data-t="language">Lingua della chiamata</span>
            <select id="call-language">
              <option value="auto" data-t="lang_auto">Auto</option>
              <option value="it" data-t="lang_it">Italiano</option>
              <option value="en" data-t="lang_en">English</option>
            </select>
          </label>
          <label class="setting switch">
            <span class="setting-label" data-t="src_mic"></span>
            <input type="checkbox" id="src-mic" checked><span class="track" aria-hidden="true"></span>
          </label>
          <label class="setting switch">
            <span class="setting-label" data-t="src_shared"></span>
            <input type="checkbox" id="src-shared" checked><span class="track" aria-hidden="true"></span>
          </label>
          <p class="hint" data-t="src_hint"></p>
        </div>

        <div class="start-row">
          <button id="start" class="primary large"><span class="icon-slot" data-icon="play"></span><span data-t="btn_start">Avvia</span></button>
          <button id="demo" class="subtle" data-t="btn_demo">Demo</button>
        </div>
        <p class="hint privacy" data-t="privacy"></p>
      </div>

      <div id="live" class="live hidden">
        <!-- The meeting bar, as in a Teams call: state and time on the left, the controls on the right, Stop in red. -->
        <div class="island meeting-bar" id="island">
          <div class="island-main">
            <span id="status-dot" class="dot"></span>
            <strong id="status">Pronto</strong>
            <span id="timer" class="timer">00:00</span>
            <span class="meters" aria-hidden="true">
              <span class="meter me" id="meter-me"><i></i><i></i><i></i><i></i><b data-t="speaker_me">Io</b></span>
              <span class="meter them" id="meter-them"><i></i><i></i><i></i><i></i><b data-t="speaker_them">Altri</b></span>
            </span>
          </div>
          <div class="island-tools">
            <span id="latency" class="meta" title=""></span>
            <span id="bridge-state" class="bridge-state meta hidden"></span>
            <select id="live-language" class="compact" aria-label="language">
              <option value="auto" data-t="lang_auto">Auto</option>
              <option value="it" data-t="lang_it">Italiano</option>
              <option value="en" data-t="lang_en">English</option>
            </select>
            <button id="ask-claude" class="bar-btn ask"><span class="icon-slot" data-icon="sparkle"></span><span id="ask-claude-label" data-t="btn_ask_claude"></span></button>
            <button id="pip" class="bar-btn"><span class="icon-slot" data-icon="windowNew"></span><span data-t="btn_pip">In primo piano</span></button>
            <button id="stop" class="leave"><span class="icon-slot" data-icon="callEnd"></span><span data-t="btn_stop">Stop</span></button>
          </div>
        </div>
        <p id="audio-info" class="audio-info"></p>
        <p id="live-hint" class="live-hint"></p>
        <div id="live-body" class="live-body">
          <section id="claude-col" class="claude-col hidden">
            <p id="follow-state" class="follow-state"></p>
            <div id="meeting" class="meeting hidden"><strong id="meeting-title"></strong><span id="meeting-goal"></span></div>
            <!-- The latest suggestions: they stay in view while the script below scrolls. -->
            <div id="now" class="now" aria-live="polite">
              <div class="now-head">
                <span class="now-label"><span class="icon-slot" data-icon="sparkle"></span><span data-t="sec_now">Adesso</span></span>
                <span id="sug-topic" class="topic waiting"></span>
                <span id="thinking" class="thinking-label hidden" data-t="claude_thinking">Claude sta pensando…</span>
                <span id="sug-time" class="sug-time"></span>
              </div>
              <div id="suggestions" class="suggestions"></div>
            </div>
            <details id="questions-box" class="fold hidden" open>
              <summary><span data-t="sec_questions"></span><span id="questions-count" class="count"></span></summary>
              <ul id="questions" class="questions"></ul>
            </details>
            <details id="sug-remember-box" class="fold hidden" open>
              <summary><span data-t="sec_remember"></span></summary>
              <ul id="remember" class="remember"></ul>
            </details>
            <!-- Every suggestion of this call, newest first: nothing disappears. -->
            <section id="script-box" class="script hidden">
              <div class="script-head">
                <h3 data-t="sec_script">Il copione</h3>
                <div id="script-filter" class="filters" role="group"></div>
              </div>
              <div id="pinned" class="pinned hidden"></div>
              <div id="script" class="script-list"></div>
            </section>
          </section>
          <section class="transcript-col">
            <div class="col-head"><span data-t="sec_transcript"></span></div>
            <div id="transcript" class="transcript" aria-live="off"></div>
          </section>
        </div>
        <div class="toasts"><p id="notice" class="notice toast hidden" role="status"></p></div>
      </div>

      <div id="ended" class="ended hidden">
        <div class="card ended-card">
          <div class="ended-mark" aria-hidden="true"><span class="icon-slot" data-icon="check"></span></div>
          <h1 class="page-title" data-t="ended_title"></h1>
          <p id="ended-meta" class="secondary"></p>
          <p id="ended-hint" class="hint"></p>
          <div class="row">
            <button id="summary-claude" class="primary" data-t="btn_summary_claude"></button>
            <button id="dl-transcript" data-t="download_transcript"></button>
            <button id="new-call" class="subtle" data-t="btn_new_call"></button>
          </div>
          <p id="summary-claude-status" class="notice hidden"></p>
        </div>
        <details id="ended-script-box" class="fold ended-script hidden" open>
          <summary><span data-t="sec_script_ended"></span><span id="ended-script-count" class="count"></span></summary>
          <div id="ended-script" class="script-list"></div>
        </details>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tab">
      <h1 class="page-title" data-t="tab_history">Archivio</h1>
      <div id="history" class="card list history"></div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab">
      <h1 class="page-title" data-t="tab_settings">Impostazioni</h1>

      <div class="card">
        <h2 class="card-title" data-t="bridge_title"></h2>
        <p class="hint"><span data-t="bridge_text"></span> <a id="bridge-howto" href="https://github.com/aaddabbo30-bit/transcript#set-it-up-once" target="_blank" rel="noopener" data-t="bridge_howto"></a></p>
        <div id="bridge-manual">
          <label class="field"><span data-t="bridge_url"></span><input id="bridge-url" type="url" placeholder="https://….workers.dev"></label>
          <div class="row"><button id="bridge-connect" class="primary" data-t="bridge_connect"></button><button id="bridge-off" class="subtle" data-t="bridge_off"></button></div>
        </div>
        <p id="bridge-here" class="hint hidden" data-t="bridge_here"></p>
        <div id="bridge-connector-box" class="hidden">
          <label class="field"><span data-t="bridge_connector"></span><input id="bridge-connector" class="connector" type="text" readonly></label>
          <p class="hint" data-t="bridge_connector_hint"></p>
          <div class="row"><button id="bridge-copy" class="primary" data-t="bridge_copy"></button><button id="bridge-clear" class="subtle destructive" data-t="bridge_clear"></button><button id="bridge-new-key" class="subtle" data-t="bridge_new_key"></button></div>
        </div>
        <p id="bridge-status" class="secondary small"></p>
        <div id="project-box" class="sub hidden">
          <h3 data-t="project_title"></h3>
          <p class="hint" data-t="project_text"></p>
          <div class="row"><button id="project-copy" data-t="project_copy"></button><span id="project-status" class="secondary small"></span></div>
        </div>
        <div class="sub">
          <label class="field"><span data-t="settings_claude_url"></span><input id="claude-url" type="url" placeholder="https://claude.ai/new"></label>
          <p class="hint"><span data-t="settings_claude_url_hint"></span> <span id="claude-url-status" class="secondary small"></span></p>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title" data-t="settings_transcription"></h2>
        <label class="field inline"><span data-t="settings_whisper"></span>
          <select id="whisper-model"><option value="base">base</option><option value="small">small</option></select>
        </label>
        <p class="hint" data-t="settings_whisper_hint"></p>
        <details id="manual-box" class="fold manual-model">
          <summary data-t="manual_title"></summary>
          <p class="hint" data-t="manual_text"></p>
          <ol id="manual-links"></ol>
          <div class="row">
            <label class="button"><span data-t="manual_pick"></span><input id="manual-files" type="file" multiple accept=".onnx,.json,.wasm" hidden></label>
            <span id="manual-status" class="secondary small"></span>
          </div>
        </details>
      </div>

      <div class="card">
        <h2 class="card-title" data-t="settings_interface"></h2>
        <label class="field inline"><span data-t="settings_theme"></span>
          <select id="ui-theme">
            <option value="dark" data-t="theme_dark">Scuro</option>
            <option value="light" data-t="theme_light">Chiaro</option>
            <option value="auto" data-t="theme_auto">Come il sistema</option>
          </select>
        </label>
        <label class="field inline"><span data-t="settings_ui"></span>
          <select id="ui-language"><option value="it">Italiano</option><option value="en">English</option></select>
        </label>
        <div class="row"><button id="settings-save" class="primary" data-t="settings_save"></button><span id="settings-status" class="secondary small"></span></div>
      </div>
    </section>
  </main>

</body>
</html>
