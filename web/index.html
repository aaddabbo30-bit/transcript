<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente chiamate</title>
  <meta name="description" content="Assistente per chiamate e video: trascrive nel browser con Whisper e Claude legge la chiamata dalla tua chat.">
  <link rel="icon" href="assets/icon.png">
  <!-- stamp:start -->
  <script type="importmap">{"imports":{"./js/app.js":"./js/app.js?v=d3416bb363","./js/audio-worklet.js":"./js/audio-worklet.js?v=d3416bb363","./js/audio.js":"./js/audio.js?v=d3416bb363","./js/bridge.js":"./js/bridge.js?v=d3416bb363","./js/history.js":"./js/history.js?v=d3416bb363","./js/i18n.js":"./js/i18n.js?v=d3416bb363","./js/model-files.js":"./js/model-files.js?v=d3416bb363","./js/prompts.js":"./js/prompts.js?v=d3416bb363","./js/segmenter.js":"./js/segmenter.js?v=d3416bb363","./js/session.js":"./js/session.js?v=d3416bb363","./js/transcriber.js":"./js/transcriber.js?v=d3416bb363","./js/transcript.js":"./js/transcript.js?v=d3416bb363","./js/whisper-worker.js":"./js/whisper-worker.js?v=d3416bb363"}}</script>
  <link rel="stylesheet" href="css/app.css?v=d3416bb363">
  <script type="module" src="js/app.js?v=d3416bb363"></script>
  <!-- stamp:end -->
</head>
<body>
  <header class="topbar">
    <img src="assets/icon.png" alt="" class="logo">
    <h1 data-t="app_title">Assistente chiamate</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="call" class="active" data-t="tab_call">Chiamata</button>
      <button role="tab" data-tab="history" data-t="tab_history">Archivio</button>
      <button role="tab" data-tab="settings" data-t="tab_settings">Impostazioni</button>
    </nav>
  </header>

  <main>
    <!-- CALL -->
    <section id="tab-call" class="tab active">
      <div id="setup" class="card">
        <div id="claude-box" class="claude-box">
          <div class="claude-head"><span id="claude-dot" class="dot"></span><strong id="claude-title"></strong></div>
          <p id="claude-text" class="hint"></p>
          <div id="claude-connector-row" class="row hidden">
            <input id="setup-connector" class="connector" type="text" readonly aria-label="connector">
            <button id="setup-copy" data-t="bridge_copy"></button>
            <button id="setup-done" class="ghost" data-t="claude_done"></button>
          </div>
          <div id="claude-settings-row" class="row hidden"><button id="go-settings" data-t="claude_go_settings"></button></div>
        </div>
        <p id="setup-notice" class="notice hidden"></p>
        <label class="field">
          <span data-t="language">Lingua della chiamata</span>
          <select id="call-language">
            <option value="auto" data-t="lang_auto">Auto</option>
            <option value="it" data-t="lang_it">Italiano</option>
            <option value="en" data-t="lang_en">English</option>
          </select>
        </label>
        <fieldset class="field">
          <legend data-t="sources">Cosa ascoltare</legend>
          <label class="check"><input type="checkbox" id="src-mic" checked> <span data-t="src_mic"></span></label>
          <label class="check"><input type="checkbox" id="src-shared" checked> <span data-t="src_shared"></span></label>
          <p class="hint" data-t="src_hint"></p>
        </fieldset>
        <div class="row">
          <button id="start" class="primary big" data-t="btn_start">▶ Avvia</button>
          <button id="demo" class="ghost" data-t="btn_demo">Demo</button>
        </div>
        <p class="hint" data-t="privacy"></p>
      </div>

      <div id="live" class="panel hidden">
        <div class="panel-head">
          <span id="status-dot" class="dot"></span>
          <strong id="status">Pronto</strong>
          <span id="timer" class="muted">00:00</span>
          <span class="spacer"></span>
          <button id="pip" class="ghost small" data-t="btn_pip">⧉</button>
          <button id="stop" class="danger" data-t="btn_stop">■ Stop</button>
        </div>
        <div class="panel-sub">
          <select id="live-language" aria-label="language">
            <option value="auto" data-t="lang_auto">Auto</option>
            <option value="it" data-t="lang_it">Italiano</option>
            <option value="en" data-t="lang_en">English</option>
          </select>
          <span id="audio-info" class="muted small"></span>
          <span id="bridge-state" class="bridge-state small hidden"></span>
          <span class="spacer"></span>
          <button id="ask-claude" class="ask" data-t="btn_ask_claude"></button>
        </div>
        <p id="notice" class="notice hidden"></p>
        <p id="live-hint" class="live-hint"></p>
        <div class="section-head"><span data-t="sec_transcript"></span></div>
        <div id="transcript" class="transcript" aria-live="off"></div>
      </div>

      <div id="ended" class="card hidden">
        <h2 data-t="ended_title"></h2>
        <p id="ended-meta" class="muted small"></p>
        <p id="ended-hint" class="hint"></p>
        <div class="row">
          <button id="summary-claude" class="ask" data-t="btn_summary_claude"></button>
          <button id="dl-transcript" data-t="download_transcript"></button>
          <button id="new-call" class="primary" data-t="btn_new_call"></button>
        </div>
        <p id="summary-claude-status" class="notice hidden"></p>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tab">
      <div id="history" class="card"></div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab">
      <div class="card">
        <h3 data-t="bridge_title"></h3>
        <p class="hint"><span data-t="bridge_text"></span> <a id="bridge-howto" href="https://github.com/aaddabbo30-bit/transcript#set-it-up-once" target="_blank" rel="noopener" data-t="bridge_howto"></a></p>
        <div id="bridge-manual">
          <label class="field"><span data-t="bridge_url"></span><input id="bridge-url" type="url" placeholder="https://….workers.dev"></label>
          <div class="row"><button id="bridge-connect" class="primary" data-t="bridge_connect"></button><button id="bridge-off" class="ghost" data-t="bridge_off"></button></div>
        </div>
        <p id="bridge-here" class="hint hidden" data-t="bridge_here"></p>
        <div id="bridge-connector-box" class="hidden">
          <label class="field"><span data-t="bridge_connector"></span><input id="bridge-connector" class="connector" type="text" readonly></label>
          <p class="hint" data-t="bridge_connector_hint"></p>
          <div class="row"><button id="bridge-copy" data-t="bridge_copy"></button><button id="bridge-clear" class="ghost" data-t="bridge_clear"></button><button id="bridge-new-key" class="ghost" data-t="bridge_new_key"></button></div>
        </div>
        <p id="bridge-status" class="muted small"></p>
        <label class="field"><span data-t="settings_claude_url"></span><input id="claude-url" type="url" placeholder="https://claude.ai/new"></label>
        <p class="hint"><span data-t="settings_claude_url_hint"></span> <span id="claude-url-status" class="muted small"></span></p>
      </div>
      <div class="card">
        <label class="field"><span data-t="settings_whisper"></span>
          <select id="whisper-model"><option value="base">base</option><option value="small">small</option></select>
        </label>
        <p class="hint" data-t="settings_whisper_hint"></p>
        <div class="manual-model">
          <h3 data-t="manual_title"></h3>
          <p class="hint" data-t="manual_text"></p>
          <ol id="manual-links"></ol>
          <div class="row">
            <label class="button"><span data-t="manual_pick"></span><input id="manual-files" type="file" multiple accept=".onnx,.json,.wasm" hidden></label>
            <span id="manual-status" class="muted small"></span>
          </div>
        </div>
        <label class="field"><span data-t="settings_ui"></span>
          <select id="ui-language"><option value="it">Italiano</option><option value="en">English</option></select>
        </label>
        <div class="row"><button id="settings-save" class="primary" data-t="settings_save"></button><span id="settings-status" class="muted small"></span></div>
      </div>
    </section>
  </main>

</body>
</html>
